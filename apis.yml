aid: veradermics
name: Veradermics
description: 'Veradermics is a dermatologist-founded, late clinical-stage biopharmaceutical
  company headquartered in New Haven, Connecticut, developing first-in-class therapeutics
  for common dermatologic and aesthetic conditions. Its lead program, VDPHL01, is an
  oral, non-hormonal candidate for pattern hair loss in men and women, in Phase II/III
  trials — the first oral pattern-hair-loss trials in nearly thirty years and the first
  US trials in female pattern hair loss. A broader pipeline targets alopecia, warts,
  molluscum contagiosum and atopic dermatitis. The company closed an oversubscribed
  $150M Series C in October 2025 and completed a US IPO in February 2026 under the
  ticker MANE. Veradermics operates no public developer program, developer portal, SDK
  or documented API; the only machine-readable surfaces on its corporate host are
  WordPress platform plumbing — an RFC 8414 / RFC 9728 OAuth discovery chain and an
  auth-gated MCP server registered by the WordPress MCP Adapter.'
